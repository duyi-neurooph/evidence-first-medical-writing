<svg xmlns="http://www.w3.org/2000/svg" lang="en" width="668" height="528" viewBox="0 0 668 528" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Participant flow in a blood pressure trial</title><desc id="figure-desc">Original participant disposition diagram. SYNTHETIC EXAMPLE · Community-based randomized trial · Counts: participants The primary analysis retained each participant in the assigned group. Missing week 12 systolic blood pressure values were multiply imputed.</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 L2 4 Z" fill="#444" /></marker></defs><rect width="668" height="528" fill="white" /><g font-family="Arial, Helvetica, sans-serif" fill="#161616"><text x="22" y="25" font-size="20" font-weight="bold">Participant flow in a blood pressure trial</text><text x="22" y="45" font-size="12" fill="#444">SYNTHETIC EXAMPLE · Community-based randomized trial · Counts: participants</text><polyline data-from="screen" data-to="randomized" points="334,109 334,245" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="screen" data-to="excluded" points="334,177 366,177" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="randomized" data-to="home" points="334,279 162,303" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="randomized" data-to="clinic" points="334,279 506,303" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="home" data-to="analysis_home" points="162,373 162,397" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="clinic" data-to="analysis_clinic" points="506,373 506,397" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><g data-node="screen"><rect x="221.5" y="75.0" width="225" height="34" fill="none" stroke="#555" stroke-width="1" /><text x="334.0" y="92.0" font-size="15" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="bold">248</tspan> <tspan>Assessed for eligibility</tspan></text></g><g data-node="excluded"><rect x="366.0" y="133.0" width="280" height="88" fill="none" stroke="#555" stroke-width="1" /><text x="378.0" y="154.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">48</tspan> <tspan x="402.15">Excluded</tspan></text><text x="393.0" y="172.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">26</tspan> <tspan x="415.54">Outside blood pressure range</tspan></text><text x="393.0" y="190.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">14</tspan> <tspan x="415.54">Declined participation</tspan></text><text x="393.0" y="208.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">8</tspan> <tspan x="407.42">Outside age range</tspan></text></g><g data-node="randomized"><rect x="259.5" y="245.0" width="149" height="34" fill="none" stroke="#555" stroke-width="1" /><text x="334.0" y="262.0" font-size="15" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="bold">200</tspan> <tspan>Randomized</tspan></text></g><g data-node="home"><rect x="22.0" y="303.0" width="280" height="70" fill="none" stroke="#555" stroke-width="1" /><text x="34.0" y="324.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">100</tspan> <tspan x="66.85">Assigned to home monitoring</tspan></text><text x="49.0" y="342.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">98</tspan> <tspan x="71.53999999999999">Started home monitoring</tspan></text><text x="49.0" y="360.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">2</tspan> <tspan x="63.42">Did not start monitoring</tspan></text></g><g data-node="clinic"><rect x="366.0" y="303.0" width="280" height="70" fill="none" stroke="#555" stroke-width="1" /><text x="378.0" y="324.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">100</tspan> <tspan x="410.85">Assigned to clinic follow-up</tspan></text><text x="393.0" y="342.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">99</tspan> <tspan x="415.54">Attended the initial visit</tspan></text><text x="393.0" y="360.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">1</tspan> <tspan x="407.42">Missed the initial visit</tspan></text></g><g data-node="analysis_home"><rect x="22.0" y="397.0" width="280" height="70" fill="none" stroke="#555" stroke-width="1" /><text x="34.0" y="418.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">100</tspan> <tspan x="66.85">Included in primary analysis</tspan></text><text x="49.0" y="436.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">94</tspan> <tspan x="71.53999999999999">Had a week 12 reading</tspan></text><text x="49.0" y="454.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">6</tspan> <tspan x="63.42">Had no week 12 reading</tspan></text></g><g data-node="analysis_clinic"><rect x="366.0" y="397.0" width="280" height="70" fill="none" stroke="#555" stroke-width="1" /><text x="378.0" y="418.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">100</tspan> <tspan x="410.85">Included in primary analysis</tspan></text><text x="393.0" y="436.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">96</tspan> <tspan x="415.54">Had a week 12 reading</tspan></text><text x="393.0" y="454.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">4</tspan> <tspan x="407.42">Had no week 12 reading</tspan></text></g><text x="22" y="491" font-size="12" fill="#444">The primary analysis retained each participant in the assigned group. Missing week 12 systolic blood</text><text x="22" y="507" font-size="12" fill="#444">pressure values were multiply imputed.</text></g></svg>
