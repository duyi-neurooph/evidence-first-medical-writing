<svg xmlns="http://www.w3.org/2000/svg" lang="en" width="500" height="510" viewBox="0 0 500 510" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">90-day pain after hip arthroplasty</title><desc id="figure-desc">Original participant disposition diagram. SYNTHETIC EXAMPLE · Prospective cohort, 2023–2024 · Counts: patients Time to first walk was recorded during routine care. The analysis used pain scores collected 83–97 days after surgery.</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 L2 4 Z" fill="#444" /></marker></defs><rect width="500" height="510" fill="white" /><g font-family="Arial, Helvetica, sans-serif" fill="#161616"><text x="22" y="25" font-size="20" font-weight="bold">90-day pain after hip arthroplasty</text><text x="22" y="45" font-size="12" fill="#444">SYNTHETIC EXAMPLE · Prospective cohort, 2023–2024 · Counts: patients</text><polyline data-from="screened" data-to="enrolled" points="164,109 164,227" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="screened" data-to="not_enrolled" points="164,168 196,168" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="enrolled" data-to="analyzed" points="164,261 164,379" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><polyline data-from="enrolled" data-to="no_outcome" points="164,320 196,320" fill="none" stroke="#444" stroke-width="1.05" stroke-linejoin="round" marker-end="url(#tip)" /><g data-node="screened"><rect x="44.0" y="75.0" width="240" height="34" fill="none" stroke="#555" stroke-width="1" /><text x="164.0" y="92.0" font-size="15" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="bold">520</tspan> <tspan>Assessed before surgery</tspan></text></g><g data-node="not_enrolled"><rect x="196.0" y="133.0" width="280" height="70" fill="none" stroke="#555" stroke-width="1" /><text x="208.0" y="154.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">64</tspan> <tspan x="232.15">Not enrolled</tspan></text><text x="223.0" y="172.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">40</tspan> <tspan x="245.54">Scheduled for revision surgery</tspan></text><text x="223.0" y="190.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">24</tspan> <tspan x="245.54">Eligible but declined</tspan></text></g><g data-node="enrolled"><rect x="36.0" y="227.0" width="256" height="34" fill="none" stroke="#555" stroke-width="1" /><text x="164.0" y="244.0" font-size="15" text-anchor="middle" dominant-baseline="central" xml:space="preserve"><tspan font-weight="bold">456</tspan> <tspan>Enrolled at primary surgery</tspan></text></g><g data-node="no_outcome"><rect x="196.0" y="285.0" width="280" height="70" fill="none" stroke="#555" stroke-width="1" /><text x="208.0" y="306.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">36</tspan> <tspan x="232.15">No 90-day pain score</tspan></text><text x="223.0" y="324.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">24</tspan> <tspan x="245.54">Did not return questionnaire</tspan></text><text x="223.0" y="342.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">12</tspan> <tspan x="245.54">Returned it after the window</tspan></text></g><g data-node="analyzed"><rect x="24.0" y="379.0" width="280" height="70" fill="none" stroke="#555" stroke-width="1" /><text x="36.0" y="400.0" font-size="15" xml:space="preserve"><tspan font-weight="bold">420</tspan> <tspan x="68.85">Analyzed for 90-day pain</tspan></text><text x="51.0" y="418.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">255</tspan> <tspan x="81.66">First walked within 24 hours</tspan></text><text x="51.0" y="436.0" font-size="14" xml:space="preserve"><tspan font-weight="bold">165</tspan> <tspan x="81.66">First walked after 24 hours</tspan></text></g><text x="22" y="473" font-size="12" fill="#444">Time to first walk was recorded during routine care. The analysis used pain</text><text x="22" y="489" font-size="12" fill="#444">scores collected 83–97 days after surgery.</text></g></svg>
