name: Feature request
description: Suggest a transferable medical-writing workflow improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the study or writing task without sensitive material.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current primary or official support
      description: Link to applicable current reporting or methodological guidance and include the date checked.
  - type: checkboxes
    id: rights
    attributes:
      label: Contribution boundary
      options:
        - label: This request does not include confidential, identifying, or copied third-party material.
          required: true
