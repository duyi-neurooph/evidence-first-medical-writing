name: Bug report
description: Report an incorrect, unsafe, or unclear workflow behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload confidential manuscripts, patient information, credentials, private peer-review material, or copyrighted source texts.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: De-identified task
      description: Describe the study type and requested workflow without sensitive material.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I removed confidential, identifying, and third-party copyrighted material.
          required: true
